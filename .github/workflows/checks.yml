name: TeamPeach checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: node --check server.js
      - run: node --check src/security.js
      - run: node --check src/email-templates.js
      - run: node --check public/js/auth.js
      - run: node --check public/js/main.js
      - run: node --check public/js/dashboard.js
      - run: node --check public/js/brief-builder.js
      - run: node --check public/js/commerce.js
      - run: node --check public/js/admin-commerce.js
      - run: node --check public/js/catalog.js
      - run: node --check public/js/custom-requests.js
      - run: node --check public/js/admin-custom-requests.js
      - run: node --check scripts/generate-sitemap.js