name: CodeQL security analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Build code for analysis
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
      - name: Print CodeQL finding locations for PR debugging
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "../results/javascript.sarif";
          if (!fs.existsSync(path)) {
            console.log("SARIF output file was not found at " + path);
            process.exit(0);
          }
          const sarif = JSON.parse(fs.readFileSync(path, "utf8"));
          for (const run of sarif.runs || []) {
            const rules = new Map((run.tool?.driver?.rules || []).map(rule => [rule.id, rule]));
            for (const result of run.results || []) {
              const loc = result.locations?.[0]?.physicalLocation || {};
              const related = (result.codeFlows || []).flatMap(flow => flow.threadFlows || [])
                .flatMap(thread => thread.locations || [])
                .map(item => ({
                  file: item.location?.physicalLocation?.artifactLocation?.uri,
                  line: item.location?.physicalLocation?.region?.startLine,
                  message: item.location?.message?.text
                }));
              console.log(JSON.stringify({
                rule: result.ruleId,
                ruleName: rules.get(result.ruleId)?.name,
                level: result.level,
                message: result.message?.text,
                file: loc.artifactLocation?.uri,
                line: loc.region?.startLine,
                related
              }));
            }
          }
          NODE
